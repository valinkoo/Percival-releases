[package]
name = "percival"
version = "0.0.1"
description = "Percival desktop client"
authors = ["Dreamastral Studio"]
edition = "2021"
rust-version = "1.77"

[lib]
# The lib name differs from the bin name to avoid a Windows-only output collision.
name = "percival_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Opens links of messages in the system browser (allowlisted in capabilities/default.json).
tauri-plugin-opener = "2"
# Session token storage: Windows Credential Manager.
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
