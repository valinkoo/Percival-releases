[package]
name = "percival"
version = "0.0.5"
description = "Percival desktop client"
authors = ["valinko"]
edition = "2021"
rust-version = "1.77"

[lib]
# The lib name differs from the bin name to avoid a Windows-only output collision.
name = "percival_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Opens links of messages in the system browser (allowlisted in capabilities/default.json).
tauri-plugin-opener = "2"
# Required by the code generated from tauri.conf.json once it has a "plugins" section.
serde_json = "1"
# Automatic updates from GitHub Releases (signed bundles, see docs/RELEASE.md) and the restart that follows.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Native Windows notifications for messages received while the window is in the background.
tauri-plugin-notification = "2"
# Session token storage: Windows Credential Manager.
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
